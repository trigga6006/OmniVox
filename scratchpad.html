<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OmniVox Scratchpad</title>
    <script>
      // Transparent background before CSS loads so the window's rounded corners
      // render against the desktop. (We DON'T use the aggressive
      // `overlay-window` class here — it nukes all borders, which the card needs.)
      document.documentElement.style.background = 'transparent';
      document.documentElement.dataset.theme = 'dark';
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/scratchpad-main.tsx"></script>
  </body>
</html>
