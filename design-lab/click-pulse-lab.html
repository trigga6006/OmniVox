<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>OmniVox · Click-Pulse Lab</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --surface-0: #0a0a0b;
        --surface-1: #141417;
        --surface-2: #1c1c21;
        --line: rgba(255, 255, 255, 0.08);
        --line-strong: rgba(255, 255, 255, 0.14);
        --text-1: #f4f4f5;
        --text-2: #a1a1aa;
        --text-3: #71717a;
        --lava: #f59e0b;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; }
      body {
        background: radial-gradient(ellipse 90% 70% at 50% 100%, #0c0c0d, #000 70%);
        color: var(--text-1);
        font-family: "Geist", system-ui, sans-serif;
        overflow: hidden;
        user-select: none;
        -webkit-user-select: none;
      }
      #stage { position: fixed; inset: 0; }
      /* Some real controls to click on, so the pulse lands on UI like in-app. */
      .demo {
        position: fixed;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 22px;
        text-align: center;
        pointer-events: none;
      }
      .demo h1 {
        font-size: 13px;
        font-weight: 500;
        letter-spacing: 0.02em;
        color: var(--text-2);
        margin: 0;
      }
      .row { display: flex; gap: 14px; pointer-events: auto; }
      .btn {
        font: 500 14px "Geist", sans-serif;
        color: var(--text-1);
        background: var(--surface-2);
        border: 1px solid var(--line-strong);
        border-radius: 13px;
        padding: 11px 20px;
        cursor: pointer;
        transition: transform 0.18s cubic-bezier(0.32, 0.72, 0, 1), border-color 0.18s;
      }
      .btn:hover { transform: translateY(-1px); border-color: rgba(232, 149, 126, 0.5); }
      .btn:active { transform: scale(0.99); }
      .btn.lava { background: var(--lava); border-color: var(--lava); color: #1a0b06; }
      .tile {
        width: 240px; height: 120px; border-radius: 18px;
        background: var(--surface-1); border: 1px solid var(--line);
        display: grid; place-items: center; color: var(--text-3);
        font: 400 12px "Geist Mono", monospace; pointer-events: auto;
      }
      /* mode switcher */
      .modes {
        position: fixed; top: 18px; left: 50%; transform: translateX(-50%);
        display: flex; gap: 6px; padding: 5px; border-radius: 999px;
        background: rgba(11, 10, 8, 0.7); border: 1px solid var(--line);
        backdrop-filter: blur(8px); z-index: 10;
      }
      .modes button {
        font: 500 12px "Geist Mono", monospace; letter-spacing: 0.04em;
        text-transform: uppercase; color: var(--text-3);
        background: transparent; border: 0; border-radius: 999px;
        padding: 7px 16px; cursor: pointer;
      }
      .modes button[data-on="1"] { color: var(--text-1); background: var(--surface-2); }
      .hint {
        position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
        font: 400 12px "Geist Mono", monospace; color: var(--text-3);
        letter-spacing: 0.04em;
      }
      kbd {
        font: inherit; color: var(--text-2); background: var(--surface-2);
        border: 1px solid var(--line-strong); border-radius: 6px; padding: 1px 6px;
      }
    </style>
  </head>
  <body>
    <canvas id="stage"></canvas>

    <div class="modes" id="modes">
      <button data-mode="dither">Dither</button>
      <button data-mode="ascii">ASCII</button>
      <button data-mode="off">Off</button>
    </div>

    <div class="demo">
      <h1>Click anywhere — buttons, cards, empty space. The paper reacts.</h1>
      <div class="row">
        <button class="btn lava">Start dictation</button>
        <button class="btn">Open history</button>
        <button class="btn">Settings</button>
      </div>
      <div class="row">
        <div class="tile">card surface · click me</div>
        <div class="tile">card surface · click me</div>
      </div>
    </div>

    <div class="hint">
      live flicker — hold/drag to scrub · switch <kbd>Dither</kbd> /
      <kbd>ASCII</kbd> above
    </div>

    <script>
      // ════════════════════════════════════════════════════════════════════
      //  CANONICAL RENDER CODE — kept in sync with src/components/ClickPulse.tsx
      // ════════════════════════════════════════════════════════════════════
      const DUR = 600;
      const DOT = 2;
      const R = 26;

      const BAYER4 = [
        [0, 8, 2, 10],
        [12, 4, 14, 6],
        [3, 11, 1, 9],
        [15, 7, 13, 5],
      ];
      // painterly palette by temperature
      const HOT = ["#f4f4f5", "#fde9c2"];
      const WARM = ["#f59e0b", "#fbbf24"];
      const EMBER = ["#d97f08", "#b45309"];
      const COLD = ["#60a5fa", "#93c5fd"];

      const clamp01 = (v) => (v < 0 ? 0 : v > 1 ? 1 : v);

      function hash2(x, y) {
        const s = Math.sin(x * 127.1 + y * 311.7) * 43758.5453;
        return s - Math.floor(s);
      }
      function vnoise(x, y) {
        const g = 16;
        const xi = Math.floor(x / g), yi = Math.floor(y / g);
        const xf = x / g - xi, yf = y / g - yi;
        const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
        const a = hash2(xi, yi), b = hash2(xi + 1, yi);
        const c = hash2(xi, yi + 1), d = hash2(xi + 1, yi + 1);
        return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
      }

      // ── DITHER ──────────────────────────────────────────────────────────
      function renderDither(ctx, p, ageMs, rnd) {
        const a = ageMs / DUR;
        if (a >= 1) return;
        const ignite = clamp01(1 - ageMs / 110);
        const crackle = Math.pow(clamp01(1 - ageMs / 330), 0.85);
        const residue = Math.pow(clamp01(1 - a), 1.5);
        const r = p.r;
        const x0 = Math.floor((p.x - r) / DOT) * DOT;
        const y0 = Math.floor((p.y - r) / DOT) * DOT;

        for (let x = x0; x <= p.x + r; x += DOT) {
          for (let y = y0; y <= p.y + r; y += DOT) {
            const dx = x - p.x, dy = y - p.y;
            const dist = Math.sqrt(dx * dx + dy * dy);
            const n = vnoise(x, y);
            const distW = dist * (0.58 + n * 0.86);
            if (distW > r) continue;
            const falloff = 1 - distW / r;
            const th = (BAYER4[(y / DOT) & 3][(x / DOT) & 3] + 0.5) / 16;

            let alpha = 0, pal = WARM;
            const resI = falloff * residue * (0.6 + n * 0.7);
            if (resI > th && rnd() < 0.45 + resI * 0.4) {
              alpha = (0.14 + resI * 0.4) * (0.65 + rnd() * 0.35);
              pal = falloff > 0.62 ? WARM : EMBER;
            }
            const crkI = falloff * falloff * crackle;
            if (rnd() < crkI * 0.46) {
              alpha = Math.max(alpha, 0.34 + rnd() * 0.4);
              const roll = rnd();
              pal = roll < 0.2 ? HOT : roll < 0.28 ? EMBER : WARM;
              if (rnd() < 0.07) pal = COLD;
            }
            if (ignite > 0 && distW < r * 0.5 && rnd() < ignite * (0.2 + falloff * 0.55)) {
              alpha = Math.max(alpha, 0.5 + ignite * 0.38);
              pal = HOT;
            }
            if (alpha <= 0.01) continue;
            ctx.fillStyle = pal[(rnd() * pal.length) | 0];
            ctx.globalAlpha = Math.min(1, alpha);
            ctx.fillRect(x, y, DOT, DOT);
          }
        }
        // electric arc filaments
        const arcs = Math.round(crackle * 2.4);
        for (let i = 0; i < arcs; i++) {
          let ax = p.x, ay = p.y, ang = rnd() * Math.PI * 2;
          const steps = 3 + ((rnd() * 4) | 0);
          for (let s = 0; s < steps; s++) {
            ang += (rnd() - 0.5) * 1.5;
            const len = DOT * (1.5 + rnd() * 2);
            ax += Math.cos(ang) * len; ay += Math.sin(ang) * len;
            if ((ax - p.x) ** 2 + (ay - p.y) ** 2 > r * r) break;
            ctx.fillStyle = rnd() < 0.5 ? HOT[0] : HOT[1];
            ctx.globalAlpha = Math.min(1, (0.4 + rnd() * 0.45) * crackle);
            ctx.fillRect(ax, ay, DOT, DOT);
          }
        }
        ctx.globalAlpha = 1;
      }

      // ── ASCII ───────────────────────────────────────────────────────────
      const CELL = 11;
      const RAMP = " .·:-=+*coxe%#"; // sparse → dense (textual, no block bars)
      const ELEC = "×/\\¦*+"; // electric override glyphs
      function renderAscii(ctx, p, ageMs, rnd) {
        const a = ageMs / DUR;
        if (a >= 1) return;
        const ignite = clamp01(1 - ageMs / 110);
        const crackle = Math.pow(clamp01(1 - ageMs / 330), 0.85);
        const residue = Math.pow(clamp01(1 - a), 1.5);
        const r = p.r + 4;
        ctx.font = `600 ${CELL}px "Geist Mono", ui-monospace, monospace`;
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        const cx0 = Math.round((p.x - r) / CELL) * CELL;
        const cy0 = Math.round((p.y - r) / CELL) * CELL;
        for (let x = cx0; x <= p.x + r; x += CELL) {
          for (let y = cy0; y <= p.y + r; y += CELL) {
            const dx = x - p.x, dy = y - p.y;
            const dist = Math.sqrt(dx * dx + dy * dy);
            const n = vnoise(x * 1.7, y * 1.7);
            const distW = dist * (0.72 + n * 0.52);
            if (distW > r) continue;
            const falloff = 1 - distW / r;

            let inten = falloff * residue * (0.7 + n * 0.6);
            let pal = falloff > 0.6 ? WARM : EMBER;
            let elec = false;
            const crkI = falloff * falloff * crackle;
            if (rnd() < crkI * 0.5) {
              inten = Math.max(inten, 0.6 + rnd() * 0.4);
              const roll = rnd();
              pal = roll < 0.25 ? HOT : roll < 0.32 ? EMBER : WARM;
              if (rnd() < 0.08) pal = COLD;
              elec = rnd() < 0.5;
            }
            if (ignite > 0 && distW < r * 0.5 && rnd() < ignite * (0.3 + falloff * 0.5)) {
              inten = Math.max(inten, 0.85);
              pal = HOT;
            }
            if (inten <= 0.06) continue;
            // per-frame visibility flicker
            if (rnd() > 0.5 + inten * 0.45) continue;

            let glyph;
            if (elec) glyph = ELEC[(rnd() * ELEC.length) | 0];
            else {
              const gi = Math.min(
                RAMP.length - 1,
                Math.max(1, ((inten * (RAMP.length - 1)) * (0.7 + rnd() * 0.55)) | 0)
              );
              glyph = RAMP[gi];
            }
            if (glyph === " ") continue;
            ctx.fillStyle = pal[(rnd() * pal.length) | 0];
            ctx.globalAlpha = Math.min(1, 0.35 + inten * 0.6 * (0.7 + rnd() * 0.3));
            ctx.fillText(glyph, x, y);
          }
        }
        ctx.globalAlpha = 1;
      }

      const RENDER = { dither: renderDither, ascii: renderAscii };

      // ════════════════════════════════════════════════════════════════════
      //  Seeded RNG (only for ?capture frozen frames)
      // ════════════════════════════════════════════════════════════════════
      function mulberry32(a) {
        return function () {
          a |= 0; a = (a + 0x6d2b79f5) | 0;
          let t = Math.imul(a ^ (a >>> 15), 1 | a);
          t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
          return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };
      }

      const params = new URLSearchParams(location.search);
      const canvas = document.getElementById("stage");
      const ctx = canvas.getContext("2d");

      if (params.get("capture")) {
        // ── frozen contact sheet for headless verification ──
        document.querySelector(".demo").style.display = "none";
        document.getElementById("modes").style.display = "none";
        document.querySelector(".hint").style.display = "none";
        const mode = params.get("mode") || "dither";
        const ages = (params.get("ages") || "0,60,120,220,360").split(",").map(Number);
        const backdrops = [
          ["#0a0a0b", "surface-0"],
          ["#141417", "surface-1"],
          ["#f59e0b", "amber"],
          ["#000000", "pure"],
        ];
        const TILE = 150, PAD = 10;
        const cols = 4, rows = ages.length;
        const W = PAD + cols * (TILE + PAD), H = PAD + rows * (TILE + PAD);
        canvas.width = W; canvas.height = H;
        canvas.style.width = W + "px"; canvas.style.height = H + "px";
        ctx.fillStyle = "#1a1a1a"; ctx.fillRect(0, 0, W, H);
        const draw = () => {
          for (let r = 0; r < rows; r++)
            for (let c = 0; c < cols; c++) {
              const ox = PAD + c * (TILE + PAD), oy = PAD + r * (TILE + PAD);
              ctx.fillStyle = backdrops[c][0];
              ctx.fillRect(ox, oy, TILE, TILE);
              const rnd = mulberry32(4242 + r * 53 + c * 191);
              RENDER[mode](ctx, { x: ox + TILE / 2, y: oy + TILE / 2, r: R }, ages[r], rnd);
            }
          document.title = "CAPTURE_READY";
        };
        // wait for font so ASCII renders in Geist Mono
        if (document.fonts && document.fonts.ready) document.fonts.ready.then(draw);
        else draw();
        setTimeout(draw, 400);
      } else {
        // ── live interactive ──
        let mode = params.get("mode") || "dither";
        let W = 0, H = 0;
        let pulses = [];
        let raf = 0, running = false;
        const resize = () => {
          const dpr = Math.min(window.devicePixelRatio || 1, 2);
          W = innerWidth; H = innerHeight;
          canvas.width = W * dpr; canvas.height = H * dpr;
          canvas.style.width = W + "px"; canvas.style.height = H + "px";
          ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        };
        resize();
        addEventListener("resize", resize);

        const frame = (now) => {
          ctx.clearRect(0, 0, W, H);
          let alive = false;
          for (const p of pulses) {
            const age = now - p.t0;
            if (age >= DUR) continue;
            alive = true;
            if (mode !== "off") RENDER[mode](ctx, p, age, Math.random);
          }
          pulses = pulses.filter((p) => now - p.t0 < DUR);
          if (alive) raf = requestAnimationFrame(frame);
          else running = false;
        };
        const spawn = (x, y) => {
          if (mode === "off") return;
          pulses.push({ x, y, t0: performance.now(), r: R + (Math.random() * 14 - 4) });
          if (pulses.length > 8) pulses.shift();
          if (!running) { running = true; raf = requestAnimationFrame(frame); }
        };
        addEventListener("pointerdown", (e) => spawn(e.clientX, e.clientY), true);
        // drag to scrub a stream of pulses
        addEventListener("pointermove", (e) => {
          if (e.buttons & 1) spawn(e.clientX, e.clientY);
        });

        const modesEl = document.getElementById("modes");
        const sync = () =>
          modesEl.querySelectorAll("button").forEach((b) =>
            b.setAttribute("data-on", b.dataset.mode === mode ? "1" : "0")
          );
        modesEl.addEventListener("click", (e) => {
          const b = e.target.closest("button");
          if (!b) return;
          mode = b.dataset.mode;
          sync();
        });
        sync();
      }
    </script>
  </body>
</html>
