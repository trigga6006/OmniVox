<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OmniVox Overlay</title>
    <!--
      Google Fonts — Geist powers display kickers + body; Geist Mono renders
      timers, kbd hints, and inline code. Matches the main window.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <script>
      // Force overlay transparent background before any CSS loads
      document.documentElement.classList.add('overlay-window');
      document.documentElement.style.background = 'transparent';
      document.documentElement.dataset.theme = 'dark';
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/overlay-main.tsx"></script>
  </body>
</html>
