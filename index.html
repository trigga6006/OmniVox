<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OmniVox</title>
    <script>
      // Apply cached theme before CSS loads to prevent flash
      try {
        var t = localStorage.getItem('omnivox-theme');
        if (t) document.documentElement.dataset.theme = t;
      } catch(e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
