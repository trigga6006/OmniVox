[package]
name = "omnivoice"
version = "0.6.2"
description = "OmniVox - Local AI Dictation"
authors = ["you"]
edition = "2021"
publish = false

[lib]
name = "omnivoice_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
dirs = "6"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.13.4", features = ["stream", "json"] }
sha2 = "0.10"
sysinfo = { version = "=0.38.4", default-features = false, features = ["system"] }
rusqlite = { version = "0.34", features = ["bundled"] }
cpal = "0.17.3"
whisper-rs = "0.16"
# Official sherpa-onnx Rust bindings — powers the Parakeet TDT (ONNX transducer)
# ASR engine family alongside whisper.cpp. Its build script downloads prebuilt
# libraries, so there is no cmake step.
#
# `shared` instead of the default `static`: the crate's Windows STATIC archive is
# built against the /MT runtime, which cannot link into this binary because
# whisper-rs-sys and llama-cpp-sys (and Rust std) use /MD — the mix fails with
# LNK2038. The shared archive links through an import library and carries its own
# runtime, so it links cleanly; sherpa's C API allocates and frees everything on
# its own side of the boundary, so nothing crosses heaps.
sherpa-onnx = { version = "1.13.5", default-features = false, features = [
    "shared",
] }
enigo = "0.2"
arboard = "3"
tauri-plugin-single-instance = "2.4.0"
# Launch-at-startup (registry Run key on Windows) — wired to the
# `auto_start` setting; enable/disable happens in commands/settings.rs.
tauri-plugin-autostart = "2"
nnnoiseless = { version = "0.5", default-features = false }
# Local LLM inference (llama.cpp bindings) for Structured Mode slot extraction.
# `default-features = false` disables openmp + android-shared-stdcxx so GPU backends
# are added explicitly via the top-level `cuda` / `vulkan` features below.
llama-cpp-2 = { version = "0.1.143", default-features = false }
# Transitive of llama-cpp-2 — pinned directly so `token_to_piece` can be fed a
# stateful UTF-8 decoder (multi-byte characters can span token boundaries).
encoding_rs = "0.8"
# URL parsing/validation for Command Mode `open_url` grounding — rejects
# embedded credentials (userinfo) and non-web schemes, and normalizes the host
# so grounding compares against a real registrable label. Already in the tree as
# a transitive dependency; pinned directly here for the grounding checks.
url = "2"
# Public Suffix List (compiled-in / embedded, offline) for eTLD+1 resolution in
# Command Mode `open_url` grounding — resolves the real registrable domain so a
# `github.evil.com.my`-style multi-part-suffix spoof can't ground on "github".
# Replaces the hand-maintained multi-part-TLD table.
psl = "2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security_Credentials",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_Threading",
    # Capability Access Manager consent store — Meeting Mode reads which
    # executables currently hold the microphone without touching COM.
    "Win32_System_Registry",
    # Process snapshot — a consent-store entry left behind by a crashed app
    # only counts as a live microphone session if the app is still running.
    "Win32_System_Diagnostics_ToolHelp",
] }
windows = { version = "0.61", features = [
    "Win32_Media_Audio",
    "Win32_Media_Audio_Endpoints",
    "Win32_System_Com",
    "Win32_System_Variant",
    "Win32_UI_Accessibility",
] }

[target.'cfg(not(target_os = "windows"))'.dependencies]
# Cross-platform global keyboard listener for hotkey support (macOS & Linux).
# Windows uses its own WH_KEYBOARD_LL hook via windows-sys.
rdev = "0.5"

[target.'cfg(target_os = "macos")'.dependencies]
core-graphics = "0.24"
objc = "0.2"
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
# Linux support planned — stubs compile without extra deps for now

[features]
default = []
# GPU acceleration for both Whisper and the Structured Mode LLM.  We bind them
# under a single flag so OmniVox ships one GPU build, not two — the installer
# already requires the Vulkan SDK, and llama.cpp's Vulkan backend is mature
# enough to get the same ~3–5× speedup.
cuda = ["whisper-rs/cuda", "llama-cpp-2/cuda"]
# Vulkan provides GPU acceleration for both AMD and NVIDIA GPUs.
# Install the Vulkan SDK, then build with: cargo build --features vulkan
# The Settings UI toggle controls runtime GPU use once compiled with this feature.
vulkan = ["whisper-rs/vulkan", "llama-cpp-2/vulkan"]
custom-protocol = ["tauri/custom-protocol"]

# Optimize heavy C/C++ deps even in debug builds — whisper.cpp and llama.cpp
# allocate huge stack frames in debug mode that cause STATUS_STACK_BUFFER_OVERRUN
# on Windows. Compiling them with opt-level 2 shrinks stack frames dramatically.
[profile.dev.package.whisper-rs-sys]
opt-level = 2

[profile.dev.package.llama-cpp-sys-2]
opt-level = 2

[package.metadata.cargo-machete]
# Build dependencies are referenced from build.rs, which machete does not
# attribute to the package dependency graph.
ignored = ["tauri-build"]
