name: frontend-health

on:
  pull_request:
  push:
    branches: [main]

jobs:
  typecheck-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # `npm run build` = tsc && vite build — catches TS type drift
      # (e.g. Rust/TS payload mismatches) and broken imports that the
      # Windows-only Rust workflow never sees.
      - name: Typecheck and build
        run: npm run build

      # vitest — pure-logic frontend tests (analytics compute, overlay sizing)
      - name: Unit tests
        run: npm test
