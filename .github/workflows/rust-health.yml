name: Rust Health

on:
  pull_request:
  push:
    branches:
      - main
      - master

# Supersede in-flight runs when new commits land on the same ref — a PR
# updated three times in an hour should not queue three 20-minute builds.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_TARGET_DIR: C:\b
  CMAKE_GENERATOR: Ninja

jobs:
  rust-health:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: src-tauri
        shell: pwsh

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          # CARGO_TARGET_DIR points at C:\b (MAX_PATH mitigation), so the
          # default workspace target dir is empty.  Without this line the
          # cache stored ~nothing and every run rebuilt whisper-rs-sys +
          # llama-cpp-sys-2 from scratch (~14 min of the 20-minute runs).
          cache-directories: C:\b
          key: rust-health

      - name: Set up MSVC developer environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install Ninja
        uses: seanmiddleditch/gha-setup-ninja@master

      # Prebuilt binaries instead of `cargo install` — compiling the three
      # audit tools from source burned 5+ minutes per run.
      - name: Install cargo-binstall
        uses: cargo-bins/cargo-binstall@main

      - name: Install audit tools
        run: cargo binstall cargo-audit cargo-deny cargo-machete --no-confirm --force

      - name: Run tests
        run: cargo test

      - name: Run Clippy
        run: cargo clippy --all-targets

      - name: Audit Rust advisories
        run: cargo audit

      - name: Check Rust dependency policy
        run: cargo deny check advisories bans licenses sources

      - name: Check unused Rust dependencies
        run: cargo machete
