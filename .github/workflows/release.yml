name: Release

# Main pushes warm the expensive Vulkan/native cache. Only signed tag builds
# may be published, and publishing runs in a separate least-privilege job.
on:
  push:
    tags:
      - "v*"
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

env:
  CARGO_TARGET_DIR: C:\b
  CMAKE_GENERATOR: Ninja

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Validate release tag and version metadata
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_NAME -cnotmatch '^v[0-9]+\.[0-9]+\.[0-9]+(?:[-+][0-9A-Za-z.-]+)?$') {
            throw "Release tags must use semantic versioning (for example, v0.5.0)."
          }
          $tagVersion = $env:GITHUB_REF_NAME.Substring(1)
          $packageVersion = (Get-Content -LiteralPath package.json -Raw | ConvertFrom-Json).version
          $tauriVersion = (Get-Content -LiteralPath src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          if ($packageVersion -cne $tagVersion -or $tauriVersion -cne $tagVersion) {
            throw "Tag $($env:GITHUB_REF_NAME), package.json ($packageVersion), and tauri.conf.json ($tauriVersion) must match."
          }

      - name: Install Rust
        uses: dtolnay/rust-toolchain@3a8b2ad3ea1212417907ff0e1b3d0c4e121bef40 # 1.94.0
        with:
          toolchain: 1.94.0

      - name: Cache Rust build
        uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        with:
          workspaces: src-tauri
          cache-directories: C:\b
          key: vulkan

      - name: Install Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Set up MSVC developer environment
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1
        with:
          arch: x64

      - name: Install Ninja
        uses: seanmiddleditch/gha-setup-ninja@7e868db0f3406270dd46e1dac26c65f621456723

      - name: Install Vulkan SDK
        uses: jakoch/install-vulkan-sdk-action@37effcfa045411f8bfbbda26df2fd1b3bf3436fa # v1
        with:
          vulkan_version: 1.4.309.0
          install_runtime: true
          cache: true
          stripdown: false

      - name: Install frontend dependencies
        run: npm ci

      - name: Require Windows signing credentials for releases
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_BASE64) -or
              [string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_PASSWORD)) {
            throw "Release signing requires WINDOWS_CERTIFICATE_BASE64 and WINDOWS_CERTIFICATE_PASSWORD repository secrets."
          }

      - name: Import Windows signing certificate
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $pfxPath = Join-Path $env:RUNNER_TEMP "omnivox-release-signing.pfx"
          [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE_BASE64))
          $password = ConvertTo-SecureString $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
          try {
            $imported = @(Import-PfxCertificate -FilePath $pfxPath -CertStoreLocation Cert:\CurrentUser\My -Password $password -Exportable:$false)
          } finally {
            Remove-Item -LiteralPath $pfxPath -Force -ErrorAction SilentlyContinue
          }
          $signers = @($imported | Where-Object { $_.HasPrivateKey })
          if ($signers.Count -ne 1) {
            throw "The configured PFX must contain exactly one certificate with a private key."
          }
          "OMNIVOX_CERTIFICATE_THUMBPRINT=$($signers[0].Thumbprint)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build Tauri app
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -like 'refs/tags/*') {
            $signingConfig = @{
              bundle = @{
                windows = @{
                  certificateThumbprint = $env:OMNIVOX_CERTIFICATE_THUMBPRINT
                  digestAlgorithm = "sha256"
                  timestampUrl = "http://timestamp.digicert.com"
                }
              }
            } | ConvertTo-Json -Depth 5
            $configPath = Join-Path $env:RUNNER_TEMP "omnivox-signing-config.json"
            Set-Content -LiteralPath $configPath -Value $signingConfig -Encoding utf8
            npm run tauri -- build --features vulkan --config $configPath
            Remove-Item -LiteralPath $configPath -Force
          } else {
            npm run tauri -- build --features vulkan
          }

      - name: Package release assets
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME}"
          INSTALLER=$(find /c/b/release/bundle/nsis -name "*.exe" 2>/dev/null | head -1)
          if [ -z "$INSTALLER" ]; then
            echo "ERROR: No NSIS installer found."
            exit 1
          fi
          INSTALLER_NAME="OmniVox-${VERSION}-x86_64-windows-setup.exe"
          CHECKSUM_NAME="OmniVox-${VERSION}-SHA256SUMS.txt"
          cp "$INSTALLER" "$INSTALLER_NAME"
          sha256sum "$INSTALLER_NAME" > "$CHECKSUM_NAME"
          echo "INSTALLER_NAME=$INSTALLER_NAME" >> "$GITHUB_ENV"
          echo "CHECKSUM_NAME=$CHECKSUM_NAME" >> "$GITHUB_ENV"

      - name: Verify Authenticode signature
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $signature = Get-AuthenticodeSignature -LiteralPath $env:INSTALLER_NAME
          if ($signature.Status -ne [System.Management.Automation.SignatureStatus]::Valid) {
            throw "Packaged installer is not validly Authenticode-signed: $($signature.Status)"
          }

      - name: Upload signed release assets
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: signed-release-assets
          if-no-files-found: error
          retention-days: 1
          path: |
            ${{ env.INSTALLER_NAME }}
            ${{ env.CHECKSUM_NAME }}

  publish-release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build-windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download signed release assets
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: signed-release-assets
          path: release-assets

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          name: OmniVox ${{ github.ref_name }}
          generate_release_notes: true
          files: release-assets/*
